# Dev services for caselaw-agent (run with: podman compose up -d)
# Firecrawl runs from its own compose project; see scripts/dev-services.sh.
services:
  db:
    image: docker.io/pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: caselaw
      POSTGRES_PASSWORD: caselaw
      POSTGRES_DB: caselaw
    ports:
      - "5433:5432"
    volumes:
      - caselaw-pgvector:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caselaw"]
      interval: 5s
      retries: 10

volumes:
  caselaw-pgvector:
